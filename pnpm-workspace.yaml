packages:
  - 'web'

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  dev:
    '@antfu/eslint-config': ^9.2.0
    lint-staged: ^15.2.0
    simple-git-hooks: ^2.11.0
  nuxt:
    nuxt: ^4.5.2
    vue: ^3.5.0
    '@vueuse/core': ^11.0.0
    '@vueuse/nuxt': ^11.0.0
    '@nuxt/eslint': ^1.0.0
    nuxt-mcp-dev: ^0.3.2
    nuxt-eslint-auto-explicit-import: ^0.2.0
  unocss:
    unocss: ^66.7.5
    '@unocss/eslint-plugin': ^66.7.5
  charts:
    lightweight-charts: ^4.2.0
    echarts: ^5.5.0
  gsap:
    gsap: ^3.12.0
  test:
    vitest: ^2.0.0
    '@vue/test-utils': ^2.4.0
    playwright: ^1.45.0
    '@playwright/test': ^1.45.0
