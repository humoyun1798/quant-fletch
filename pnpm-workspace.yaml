shellEmulator: true

trustPolicy: no-downgrade

packages:
  - web

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  charts:
    echarts: ^5.5.0
    lightweight-charts: ^4.2.0
  dev:
    '@antfu/eslint-config': ^9.2.0
    lint-staged: ^15.2.0
    simple-git-hooks: ^2.11.0
    typescript: ^5.9.2
  gsap:
    gsap: ^3.12.0
  nuxt:
    '@nuxt/eslint': ^1.0.0
    '@vueuse/core': ^11.0.0
    '@vueuse/nuxt': ^11.0.0
    nuxt: ^4.5.2
    nuxt-eslint-auto-explicit-import: ^0.2.0
    nuxt-mcp-dev: ^0.3.2
    vue: ^3.5.0
  test:
    '@playwright/test': ^1.45.0
    '@vue/test-utils': ^2.4.0
    vitest: ^3.2.7
  unocss:
    '@unocss/eslint-plugin': ^66.7.5
    '@unocss/nuxt': ^66.7.5
    '@unocss/preset-web-fonts': ^66.7.5
    unocss: ^66.7.5
